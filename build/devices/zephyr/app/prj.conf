CONFIG_STDOUT_CONSOLE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_EVENTS=y
CONFIG_NEWLIB_LIBC=y
CONFIG_REBOOT=y

CONFIG_ASSERT=y
# XS runs on the main thread; mcconfig overrides the stack size with the manifest's creation.nativeStack
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=3
# the kernel heap is the sum of each subsystem's requirement: the runtime's is HEAP_MEM_POOL_ADD_SIZE_MODDABLE (app Kconfig)
CONFIG_MULTITHREADING=y

CONFIG_HWINFO=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# future
# CONFIG_NETWORKING

CONFIG_SYS_HEAP_RUNTIME_STATS=y
